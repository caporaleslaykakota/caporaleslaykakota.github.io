<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Caporales Laykakota">
    <meta name="theme-color" content="#070b15">
    <title>Caporales Laykakota</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <!-- Swiper.js CSS Local (Asegúrate de colocarlo en tu ruta de producción para GitHub Pages) -->
    <link rel="stylesheet" href="assets/vendor/swiper/swiper-bundle.min.css" />
</head>

<body>
    <header class="header">
        <div class="container header-inner"><a class="brand" href="#inicio"><img
                    src="assets/images/brand/logo-laykakota.webp" alt="Logo Caporales Laykakota"><span
                    id="brandName">Laykakota</span></a>
            <nav class="nav" id="nav"></nav><button class="menu-btn" id="menuBtn" aria-label="Abrir menú"
                aria-expanded="false"><span class="hamburger"></span></button>
        </div>
    </header>
    <main>
        <section class="hero" id="inicio">
            <div class="container hero-content">
                <div class="eyebrow" id="heroEyebrow"></div>
                <h1 id="heroTitle"></h1>
                <p class="lead" id="heroText"></p>
                <div class="actions"><a class="btn primary" id="heroJoin" target="_blank"><span id="heroPrimary"></span></a><a
                        class="btn ghost" href="#nosotros"><span id="heroSecondary"></span></a></div>
            </div>
        </section>
        
        <!-- Sección Nosotros -->
        <section class="section identity" id="nosotros">
            <div class="container">
                <div class="section-head">
                    <div>
                        <div class="kicker" id="aboutKicker"></div>
                        <h2 id="aboutTitle"></h2>
                    </div>
                    <p id="aboutIntro"></p>
                </div>
                
                <div class="identity-layout-fixed">
                    <div class="identity-circle-container">
                        <img id="aboutImage" src="" alt="Identidad Caporales Laykakota" loading="lazy">
                    </div>
                    <article class="card gold identity-content-box">
                        <div class="identity-block">
                            <h3 id="missionTitle"></h3>
                            <p id="mission"></p>
                        </div>
                        <div class="identity-block">
                            <h3 id="visionTitle"></h3>
                            <p id="vision"></p>
                        </div>
                        <div class="identity-values-inline">
                            <h3 id="valuesTitle"></h3>
                            <div class="values" id="values"></div>
                        </div>
                    </article>
                </div>
            </div>
        </section>

        <section class="section" id="galeria">
            <div class="container">
                <div class="section-head">
                    <div>
                        <div class="kicker" id="galleryKicker"></div>
                        <h2 id="galleryTitle"></h2>
                    </div>
                    <p id="galleryText"></p>
                </div>
                <p class="gallery-intro" id="galleryIntro"></p>
                <div class="years" id="years"></div>
                <div class="experiences" id="experiences"></div>
                
                <div class="rehearsal-block">
                    <div class="rehearsal-header-group">
                        <div class="kicker">Ensayos</div>
                        <h2 id="rehearsalTitle"></h2>
                        <p class="gallery-intro" id="rehearsalText"></p>
                    </div>
                    
                    <div class="swiper rehearsals-swiper">
                        <div class="swiper-wrapper" id="rehearsals"></div>
                        <div class="swiper-pagination"></div>
                        <div class="swiper-button-prev"></div>
                        <div class="swiper-button-next"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN AGENDA LAYKAKOTA -->
        <section class="section agenda" id="agenda">
            <div class="container">
                <div class="section-head">
                    <div>
                        <div class="kicker" id="agendaKicker"></div>
                        <h2 id="agendaTitle"></h2>
                    </div>
                    <p id="agendaText"></p>
                </div>
                
                <!-- Carrusel de Próximos 5 Eventos/Ensayos -->
                <div class="swiper agenda-swiper">
                    <div class="swiper-wrapper" id="events"></div>
                    <div class="swiper-pagination"></div>
                </div>

                <div class="agenda-actions">
                    <button class="btn-show-more" id="openCalendarModalBtn">Mostrar mas eventos</button>
                </div>
            </div>
        </section>
        
        <!-- Sección RCC -->
        <section class="section rcc" id="rcc">
            <div class="container rcc-grid">
                <div class="rcc-content">
                    <div class="kicker" id="rccKicker"></div>
                    <h2 id="rccTitle"></h2>
                    <blockquote class="rcc-quote" id="rccSubtitle"></blockquote>
                    <p class="lead" id="rccText"></p>
                    <div class="rcc-actions">
                        <button class="btn primary" id="rccCtaBtn" style="display: none;"></button>
                    </div>
                </div>
                <div class="rcc-visual" id="rccVisualCard">
                    <img id="rccPreviewImg" src="" alt="Ritmo, Color y Candelaria" loading="lazy">
                </div>
            </div>
        </section>
        
        <!-- Sección Únete -->
        <section class="section join-section" id="unete">
            <div class="container join-grid">
                <div>
                    <div class="kicker" id="joinKicker"></div>
                    <h2 id="joinTitle"></h2>
                    <p class="lead" id="joinText"></p><a class="btn primary" id="joinButtonLink" target="_blank"
                        rel="noopener"><span id="joinButton"></span></a>
                </div>
                <div class="steps" id="steps"></div>
            </div>
        </section>

        <section class="section contact" id="contacto">
            <div class="container contact-grid">
                <div>
                    <div class="kicker" id="contactKicker"></div>
                    <h2 id="contactTitle"></h2>
                    <p class="lead" id="contactText"></p>
                    <div class="actions">
                        <a class="btn primary" id="waContact" target="_blank" rel="noopener">Hablar por WhatsApp</a>
                    </div>
                </div>
                <div class="contact-list">
                    <div class="contact-row"><small>Teléfono: </small><strong id="phone"></strong></div>
                    <div class="contact-row"><small>Correo institucional: </small><a id="emailLinkText" class="contact-link"><strong id="email"></strong></a></div>
                    <div class="contact-row"><small>Nuestras Redes: </small></div>
                    <div class="socials social-icons" aria-label="Redes sociales"><a id="instagramLink" target="_blank"
                            rel="noopener" aria-label="Instagram" title="Instagram"><img
                                src="assets/icons/instagram.svg" alt=""></a><a id="tiktok" target="_blank"
                            rel="noopener" aria-label="TikTok" title="TikTok"><img src="assets/icons/tiktok.svg"
                                alt=""></a><a id="facebook" target="_blank" rel="noopener" aria-label="Facebook"
                            title="Facebook"><img src="assets/icons/facebook.svg" alt=""></a><a id="youtube"
                            target="_blank" rel="noopener" aria-label="YouTube" title="YouTube"><img
                                src="assets/icons/youtube.svg" alt=""></a><a id="spotify" target="_blank" rel="noopener"
                            aria-label="Spotify" title="Spotify"><img src="assets/icons/spotify.svg" alt=""></a></div>
                </div>
            </div>
        </section>
    </main>
    <footer class="footer">
        <div class="container footer-inner"><span id="footerCopy"></span></div>
    </footer>

    <!-- Modal de Galería -->
    <div class="modal" id="galleryModal">
        <div class="modal-panel">
            <div class="modal-top">
                <div>
                    <div class="modal-meta" id="modalMeta"></div>
                    <h2 id="modalTitle"></h2>
                    <p class="modal-text" id="modalText"></p>
                </div><button class="modal-close" id="modalClose" aria-label="Cerrar">×</button>
            </div>
            <div class="modal-grid" id="modalGrid"></div>
        </div>
    </div>

    <!-- MODAL DE CALENDARIO DE AGENDA -->
    <div class="modal" id="calendarModal">
        <div class="modal-panel calendar-modal-panel">
            <div class="modal-top">
                <div>
                    <div class="modal-meta">Agenda Institucional</div>
                    <h2>Calendario de Actividades</h2>
                </div>
                <button class="modal-close" id="calendarModalClose" aria-label="Cerrar">×</button>
            </div>
            <div class="calendar-modal-body">
                <div>
                    <div class="calendars-container" id="calendarsContainer"></div>
                    <div class="calendar-legend">
                        <div class="legend-item"><span class="legend-box event"></span> Evento</div>
                        <div class="legend-item"><span class="legend-box ensayo"></span> Ensayo</div>
                        <div class="legend-item"><span class="legend-box dual"></span> Ambos (Coincidencia)</div>
                    </div>
                </div>
                <div class="detail-panel" id="calendarDetailPanel">
                    <p style="color: #64748b; text-align: center; font-size: 0.9rem;">Haz clic en una fecha para ver las actividades.</p>
                </div>
            </div>
        </div>
    </div>
    
    <a class="whatsapp-float" id="whatsapp" target="_blank" rel="noopener" aria-label="Chat de WhatsApp">
        <img src="assets/icons/whatsapp.svg" alt="WhatsApp">
    </a>

    <!-- Swiper.js JS Local -->
    <script src="assets/vendor/swiper/swiper-bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
